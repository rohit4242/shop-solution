                              minLength: 1
                            category:
                              type: string
                              minLength: 1
                              maxLength: 128
                            imageUrls:
                              type: array
                              items:
                                type: string
                                format: uri
                            priceMinor:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            currency:
                              type: string
                              const: EUR
                            availability:
                              type: string
                              enum:
                                - in_stock
                                - out_of_stock
                          required:
                            - offerId
