                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/search/autocomplete:
    get:
      operationId: autocomplete
      summary: Autocomplete
      description:
        Suggest visible product names as customers type. Matches the start
        of the full normalized name. Results are alphabetical with product ID as
        a tie-breaker; query history is not stored.
      tags:
        - Search
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description:
            At least 2 characters; at most 200 characters and 20 terms.
            Normalized name prefix.
          schema:
            type: string
            maxLength: 200
        - name: category
          in: query
          required: false
          description: Exact category name, 1–128 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: availability
          in: query
          required: false
          description: in_stock or out_of_stock. Omit to include both.
          schema:
            type: string
            enum:
              - in_stock
              - out_of_stock
        - name: limit
          in: query
          required: false
          description: "1–10 suggestions. Default: 5."
          schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: Success (including empty results)
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      suggestions:
                        type: array
                        items:
                          type: object
                          properties:
                            productId:
                              type: string
                              minLength: 1
                              maxLength: 128
                            name:
                              type: string
                          required:
                            - productId
                            - name
                          additionalProperties: false
                    required:
                      - suggestions
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
              examples:
                success:
                  value:
                    data:
                      suggestions:
                        - productId: prd_1
                          name: Wireless Mouse
                empty:
                  value:
                    data:
                      suggestions: []
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /api/v1/recommendations/similar:
    get:
      operationId: similar
      summary: Similar products
      description:
        Find alternatives in the source product's category. Same category
        only. Rank by shared attribute pairs, then absolute price difference,
        then product ID. Exclude the source. Missing or hidden sources return
        404.
      tags:
        - Recommendations
      security: []
      parameters:
        - name: productId
          in: query
          required: true
          description: Active source product identifier, 1–128 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: availability
          in: query
          required: false
          description: in_stock or out_of_stock. Omit to include both.
          schema:
            type: string
            enum:
              - in_stock
              - out_of_stock
        - name: limit
          in: query
          required: false
          description: "1–20 items. Default: 5."
          schema:
            default: 5
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Success (including empty results)
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
