components:
  schemas:
    DiscoveryItem:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        offerId:
          type: string
          minLength: 1
          maxLength: 128
        productId:
          type: string
          minLength: 1
          maxLength: 128
        sellerId:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
          maxLength: 128
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        priceMinor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          const: EUR
        availability:
          type: string
          enum:
            - in_stock
            - out_of_stock
      required:
        - offerId
        - productId
        - sellerId
        - name
        - category
        - imageUrls
        - priceMinor
        - currency
        - availability
      additionalProperties: false
    Error:
      $schema: https://json-schema.org/draft/2020-12/schema
