                          type: object
                          properties:
                            offerId:
                              type: string
                              minLength: 1
                              maxLength: 128
                            productId:
                              type: string
                              minLength: 1
                              maxLength: 128
                            sellerId:
                              type: string
                              minLength: 1
                              maxLength: 128
                            name:
                              type: string
                              minLength: 1
                            category:
                              type: string
                              minLength: 1
                              maxLength: 128
                            imageUrls:
                              type: array
                              items:
                                type: string
                                format: uri
                            priceMinor:
                              type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            currency:
                              type: string
                              const: EUR
                            availability:
                              type: string
                              enum:
                                - in_stock
                                - out_of_stock
                          required:
                            - offerId
                            - productId
                            - sellerId
                            - name
                            - category
                            - imageUrls
                            - priceMinor
                            - currency
                            - availability
                          additionalProperties: false
                    required:
                      - items
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
              examples:
                success:
                  value:
                    data:
                      items:
                        - offerId: off_5
                          productId: prd_5
                          sellerId: sel_3
                          name: Desk Speaker
                          category: Electronics
                          imageUrls: *a1
                          priceMinor: 2999
                          currency: EUR
                          availability: in_stock
                empty:
                  value:
                    data:
                      items: []
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "500":
          description: Unexpected error
          content:
