name: Cross-group review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Review event]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number
        required: true
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  review-policy:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/check-reviews')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Never check out or execute code from a fork in this workflow.
            const candidates = context.eventName === 'workflow_run'
              ? await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 })
              : [(await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request?.number ?? context.payload.issue?.number ?? Number(context.payload.inputs.pull_number) })).data];
            for (const pr of candidates) {
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: '.github/review-groups.json', ref: pr.base.sha });
            const policy = JSON.parse(Buffer.from(file.content, 'base64').toString());
            const membership = new Map();
            for (const [group, members] of Object.entries(policy.groups)) {
              for (const login of members) {
                const key = login.toLowerCase();
                if (membership.has(key)) throw new Error('Roster contains duplicate membership: ' + key);
                membership.set(key, group);
              }
            }
            const authorGroup = membership.get(pr.user.login.toLowerCase());
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...context.repo, pull_number: pr.number, per_page: 100 });
            const latest = new Map();
            for (const review of reviews.sort((a,b) => a.id - b.id)) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login.toLowerCase(), review);
            }
            const groups = new Set();
            for (const [login, review] of latest) {
              const group = membership.get(login);
              if (authorGroup && group && group !== authorGroup && review.state === 'APPROVED' && review.commit_id === pr.head.sha) groups.add(group);
            }
            const passed = Boolean(authorGroup) && groups.size >= policy.requiredOtherGroups;
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.head.sha, context: 'cross-group-review', state: passed ? 'success' : 'failure', description: authorGroup ? `${groups.size}/${policy.requiredOtherGroups} other groups approved current revision` : 'Add PR author and reviewers to the trusted class roster' });
            }
