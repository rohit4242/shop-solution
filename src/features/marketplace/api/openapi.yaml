openapi: 3.1.0
info:
  title: Marketplace API
  version: 3.0.0
  summary: Seller onboarding, listings with moderation, the public catalog, and
    sales handed to Accounting.
  description: >-
    Owned by the Marketplace team. Contract and rules:
    `src/features/marketplace/README.md`.


    - Success bodies are `{ "data": ... }`; failures are `{ "error": { code,
    message, fieldErrors? } }`.

    - Money is integer minor units, VAT included: `1999` = EUR 19.99. Only
    `EUR`.

    - Timestamps are ISO 8601 UTC.

    - Only offers that are `active` and whose shop is `active` are public.

    - Commission and payouts are Accounting's: Marketplace sends each sale line
    to Accounting.


    In-app features call the same operations directly from
    `@/features/marketplace/server`.


    3.0.0 moves the 2.2.0 API (FastAPI) into the shared Next.js app: routes
    under `/api/v1/marketplace`,

    the `{ data }` envelope, 400 instead of 422 for validation errors, Better
    Auth sessions instead of

    Identity bearer tokens, the shop owner taken from the session (no `userId`
    in `registerSeller`),

    `GET /sellers/me`, and `/sales/{saleId}/accounting-handoff` instead of
    `/commission-invoice`.
servers:
  - url: /api/v1/marketplace
    description: This application
tags:
  - name: catalog
    description: Public reads for Storefront and Search & Recommendations
  - name: sellers
    description: Shop onboarding and details
