openapi: 3.1.0
info:
  title: Marketplace API
  version: 3.0.0
  summary:
    Seller onboarding, listings with moderation, the public offer catalog,
    and each shop's sales.
  description: >-
    Owned by the Marketplace team. Contract and rules:
    `src/features/marketplace/README.md`.


    - Success bodies are `{ "data": ... }`; failures are `{ "error": { code,
    message, fieldErrors? } }`.

    - Money is integer minor units, VAT included: `1999` = EUR 19.99. Only `EUR`
    for now.

    - Timestamps are ISO 8601 UTC. IDs are the canonical shop IDs (`cuid`).

    - Reads and writes use the shared shop tables: `Seller`, `SellerMember`,
    `Product`, `ProductVariant`, `Offer`, `OfferItem`, `InventoryBalance`,
    `OfferImage` and, read-only, `Category` and `OrderLine`.

    - An offer is public only when the offer, its shop and its product are
    `active`.


    In-app features call the same operations directly from
    `@/features/marketplace/server`.


    3.0.0 moves the 2.2.0 API (FastAPI) into the shared Next.js app on the
    canonical shop schema:

    routes under `/api/v1/marketplace`, the `{ data }` envelope, 400 instead of
    422 for validation errors,

    Better Auth sessions, canonical IDs without prefixes, `categorySlug` from
    the shared catalog,

    `items` (offer items) instead of `variations`, image keys instead of image
    IDs, and sales derived

    from order lines (`GET /sellers/{sellerId}/sales`). Marketplace no longer
    records sales or

    calls Accounting.
servers:
  - url: /api/v1/marketplace
    description: This application
tags:
  - name: catalog
    description: Public reads for Storefront and Search & Recommendations
  - name: sellers
    description: Shop onboarding and details
  - name: listings
    description: A seller's offers and images
  - name: moderation
    description: Approving shops and offers
  - name: sales
    description: A shop's purchased order lines
